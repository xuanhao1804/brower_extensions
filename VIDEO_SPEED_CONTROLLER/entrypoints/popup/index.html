<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="manifest.default_icon"
      content='{"16":"icon/16.png","32":"icon/32.png","48":"icon/48.png"}'
    />
    <title>Video Speed Controller</title>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="presentation">
              <rect width="48" height="48" rx="12" />
              <path d="M11.5 14.5 24 24 11.5 33.5V14.5Zm13 0L37 24 24.5 33.5V14.5Z" />
            </svg>
          </div>
          <div>
            <h1>Video speed</h1>
            <p>Precise control for HTML5 players</p>
          </div>
        </div>
      </header>

      <section class="quick-panel" aria-labelledby="quick-title">
        <div class="section-heading">
          <h2 id="quick-title">Quick speed</h2>
          <span>Active video</span>
        </div>
        <div id="preset-buttons" class="presets"></div>
      </section>

      <form id="settings-form">
        <div class="settings-sheet">
          <section class="settings-row" aria-labelledby="playback-title">
            <div class="section-heading">
              <h2 id="playback-title">Playback</h2>
            </div>
            <div class="playback-grid">
              <label>
                <span>Default</span>
                <input id="default-speed" type="number" min="0.25" max="16" step="0.05" />
              </label>
              <label>
                <span>Step</span>
                <input id="speed-step" type="number" min="0.05" max="4" step="0.05" />
              </label>
              <label class="preset-field">
                <span>Presets</span>
                <input id="presets" type="text" placeholder="0.5, 1, 1.5, 2, 3" />
              </label>
            </div>
          </section>

          <section class="settings-row" aria-labelledby="shortcut-title">
            <div class="section-heading">
              <h2 id="shortcut-title">Keyboard shortcuts</h2>
              <span>Click a keycap, then press keys</span>
            </div>
            <div class="shortcut-grid">
              <div class="shortcut-item">
                <span>Slower</span>
                <button type="button" class="shortcut" data-action="decrease"></button>
              </div>
              <div class="shortcut-item">
                <span>Faster</span>
                <button type="button" class="shortcut" data-action="increase"></button>
              </div>
              <div class="shortcut-item">
                <span>Reset</span>
                <button type="button" class="shortcut" data-action="reset"></button>
              </div>
            </div>
          </section>

          <section class="settings-row behavior-row" aria-labelledby="behavior-title">
            <h2 id="behavior-title" class="visually-hidden">Mouse and on-video controls</h2>
            <div class="behavior-grid">
              <div class="behavior-block">
                <label class="toggle-row">
                  <span>
                    <strong>Mouse wheel</strong>
                    <small>Adjust over the video</small>
                  </span>
                  <input id="wheel-enabled" class="switch" type="checkbox" />
                </label>
                <label class="compact-field">
                  <span>Hold key</span>
                  <select id="wheel-modifier">
                    <option value="Alt">Alt</option>
                    <option value="Control">Ctrl</option>
                    <option value="Shift">Shift</option>
                    <option value="Meta">Meta</option>
                    <option value="None">No modifier</option>
                  </select>
                </label>
              </div>

              <div class="behavior-block">
                <label class="toggle-row">
                  <span>
                    <strong>On-video control</strong>
                    <small>Show the speed badge</small>
                  </span>
                  <input id="show-badge" class="switch" type="checkbox" />
                </label>
                <label class="opacity-field">
                  <span>Opacity <output id="opacity-value"></output></span>
                  <input id="badge-opacity" type="range" min="0.2" max="1" step="0.05" />
                </label>
              </div>
            </div>
            <p class="gesture-hint">Click cycles speed, right-click resets, hover reveals controls.</p>
          </section>
        </div>

        <footer>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <div class="footer-actions">
            <button id="reset-settings" class="secondary" type="button">Restore</button>
            <button id="save-settings" class="primary" type="submit">Save changes</button>
          </div>
        </footer>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
